name: Build SKURGE Android APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-22.04

steps:
  - name: Checkout SKURGE
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Android build dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git zip unzip \
        python3-pip python3-venv \
        autoconf automake libtool pkg-config \
        zlib1g-dev libncurses5-dev libncursesw5-dev \
        libtinfo5 cmake libffi-dev libssl-dev \
        build-essential ccache

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install Buildozer
    run: |
      python -m pip install --upgrade pip
      pip install buildozer cython==0.29.36

  - name: Create Buildozer configuration
    run: |
      cat > buildozer.spec <<'EOF'
      [app]
      title = SKURGE - THE BUSINESS OS
      package.name = skurgebusinessos
      package.domain = org.lkayindustries
      source.dir = frontend
      source.include_exts = py,kv,png,jpg,jpeg,atlas,ttf,otf,json,db
      version = 0.1.0
      requirements = python3,kivy
      orientation = portrait
      fullscreen = 0
      android.api = 35
      android.minapi = 23
      android.archs = arm64-v8a
      android.accept_sdk_license = True

      [buildozer]
      log_level = 2
      warn_on_root = 1
      EOF

  - name: Build APK
    run: buildozer -v android debug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: SKURGE-Android-APK
      path: bin/*.apk
      if-no-files-found: error
